apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: predikta-outguess
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:INSTANCE_NAME
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: outguess-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 40
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/outguess/app:VERSION
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: PUBLIC_URL
              value: https://YOUR_APP_DOMAIN
            - name: INSTANCE_CONNECTION_NAME
              value: PROJECT_ID:REGION:INSTANCE_NAME
            - name: DB_NAME
              value: outguess
            - name: DB_USER
              value: outguess
            - name: DB_POOL_MAX
              value: '5'
            - name: DEMO_MODE
              value: '0'
            - name: ADSPARK_CONTACT_URL
              value: https://www.adspark.ph/get-in-touch
            - name: ADSPARK_PRIVACY_POLICY_URL
              value: https://www.adspark.ph/privacy-policy
            - name: DB_PASSWORD
              value: REPLACE_WITH_DB_PASSWORD
            - name: SESSION_SECRET
              value: REPLACE_WITH_32_PLUS_CHARACTER_SESSION_SECRET
            - name: STAFF_PIN
              value: 'REPLACE_WITH_PRIVATE_PIN'
          startupProbe:
            httpGet:
              path: /api/health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
